# Automatyczne aktualizacje zależności (OWASP 2025 A03 — Software Supply Chain).
# Dependabot otwiera PR-y, które przechodzą przez pełną bramkę jakości (CI).
version: 2
updates:
  # Zależności npm. Aktualizacje minor/patch grupujemy w jeden PR, żeby nie
  # zasypywać repozytorium; major zostaje osobno (może wymagać uwagi).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # Akcje GitHub (przypięte po SHA — Dependabot podnosi SHA i komentarz wersji).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    groups:
      github-actions:
        update-types:
          - minor
          - patch
