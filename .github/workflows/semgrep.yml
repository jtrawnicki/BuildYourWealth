name: Semgrep

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Cotygodniowy pełny skan (poniedziałek 06:00 UTC) — łapie nowe reguły
    - cron: "0 6 * * 1"

permissions:
  contents: read
  actions: read # upload-sarif (codeql-action v4) czyta dane uruchomienia workflow
  security-events: write # pozwala wrzucić wyniki do zakładki Security

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Oficjalny obraz z zainstalowanym Semgrepem
    container:
      image: semgrep/semgrep
    # Nie uruchamiaj na forkach (brak sekretów i uprawnień)
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep ci --sarif --output=semgrep.sarif
        env:
          # Zestaw reguł; "auto" dobiera je po językach w repo
          SEMGREP_RULES: >-
            p/default
            p/typescript
            p/javascript
            p/nextjs
            p/secrets
        continue-on-error: true
      # Upload do zakładki Security wymaga włączonego Code scanning (GitHub
      # Advanced Security — niedostępne dla prywatnego repo na darmowym planie).
      # Gdy go brak, krok tylko ostrzega i nie wywala joba; sam skan wyżej i tak
      # działa. Po upublicznieniu repo lub włączeniu GHAS wyniki wrócą do Security.
      - name: Wyślij wyniki do GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: semgrep.sarif
