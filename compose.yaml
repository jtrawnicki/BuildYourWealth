services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: byw
      POSTGRES_PASSWORD: byw
      POSTGRES_DB: byw_dev
    ports:
      # Tylko z tego komputera: baza wersji prywatnej nie jest dostępna z sieci.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byw -d byw_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
